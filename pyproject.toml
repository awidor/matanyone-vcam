[project]
name = "matanyone-obs"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "matanyone2 @ git+https://github.com/pq-yang/MatAnyone2.git@e3370127319c63a6dc8a49c69de2d41d90137f91",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
    "huggingface_hub>=0.26.0",
    "onnx>=1.21.0",
    "onnxruntime-gpu>=1.23.2",
    "onnxscript>=0.7.0",
    "polygraphy>=0.49.26",
    "pyvirtualcam>=0.15.0",
    "tensorrt>=10.16.1.11",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.setuptools]
py-modules = []
