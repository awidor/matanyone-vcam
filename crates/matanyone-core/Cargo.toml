[package]
name = "matanyone-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "matanyone_core"
path = "src/lib.rs"

[[bin]]
name = "matanyone_trt_bench"
path = "src/bin/matanyone_trt_bench.rs"

[[bin]]
name = "matanyone_runner_bench"
path = "src/bin/matanyone_runner_bench.rs"

[[bin]]
name = "matanyone_runner_raw"
path = "src/bin/matanyone_runner_raw.rs"

[[bin]]
name = "matanyone_core_smoke"
path = "src/bin/matanyone_core_smoke.rs"

[features]
default = ["sam-python"]
sam-python = ["dep:base64", "dep:tempfile"]

[dependencies]
anyhow = "1"
image = "0.25"
serde_json = "1"
base64 = { version = "0.22", optional = true }
tempfile = { version = "3", optional = true }

[build-dependencies]
bindgen = "0.71"
cc = "1"
