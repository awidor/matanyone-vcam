[package]
name = "matanyone-vcam"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
egui = "0.31"
image = "0.25"
tempfile = "3"
nokhwa = { version = "0.10", features = ["input-native"] }
parking_lot = "0.12"
tray-icon = "0.19"
base64 = "0.22"
serde_json = "1"
virtualcam = "0.1"

[build-dependencies]
cmake = "0.1"
